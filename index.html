 Among these, matplotlib is one of the most widely used libraries, especially for creating high-quality 2D visualizations suitable for publication. It was originally developed by John Hunter in 2002 to replicate MATLAB-style plotting functionality in Python.</p><p>Over the years, the matplotlib project has worked closely with the IPython/Jupyter ecosystem to make it easier to create interactive plots directly within Jupyter notebooks. The library is compatible with various graphical user interface (GUI) backends across different operating systems and supports exporting visuals in numerous vector and image formats, such as PDF, SVG, PNG, JPG, GIF, BMP, and others.</p><p>Most of the figures presented in this textbook were generated using matplotlib. Furthermore, a number of higher-level visualization libraries have been built on top of matplotlib. One such popular library is seaborn, which is discussed later in the chapter.</p><p>To work with matplotlib interactively in a Jupyter notebook, you can activate inline plotting by executing:</p><p>%matplotlib notebook</p><p>This enables a dynamic interface for generating and interacting with plots directly within the notebook environment.</p><h3>1. A Brief matplotlib API Primer 1.1. Figures and Subplots</h3><p>To start using matplotlib, a popular Python library for visualizations, you typically import its pyplot module with the following line of code:</p><p>import matplotlib.pyplot as plt</p><p>If you&#x27;re working within a Jupyter Notebook, enabling inline or interactive plotting is helpful. You can do this using:</p><p>%matplotlib notebook</p><p>This sets up the notebook to render plots directly within the interface. Once configured, you can begin creating basic plots such as line graphs. For instance:</p><h4>Figure 1: Simple line plot</h4><p>This line command creates a simple line chart using default figure and subplot settings.</p><h3>A) Figure and Subplot Structure:</h3><p>In matplotlib, every plot lives inside a Figure object. You can manually create a figure using:</p><p>fig = plt.figure()</p><p>At this point, the figure exists but will be empty unless you add a subplot. Subplots are added using:</p><p>ax1 = fig.add_subplot(2, 2, 1)</p><p>This means you want to divide the figure into a 2x2 grid and create (or select) the first subplot    (top-left). Subsequent       subplots    can     be     added       similarly.</p><h4>Figure 2: An empty matplotlib figure with three subplots</h4><p>Here, run the given commands in the same cell:</p><p>fig = plt.figure()</p><p>ax1 = fig.add_subplot(2, 2, 1)</p><p>ax2 = fig.add_subplot(2, 2, 2)</p><p>ax3 = fig.add_subplot(2, 2, 3)</p><p>plt.plot([1.5, 3.5, -2, 1.6])</p><p>While executing, mat plotlib draws on the last figure and subplot used. So, add the following command, to create subplot like Figure 3.</p><p>plt.plot(np.random.randn(50).cumsum(),                                                    &#x27;k--&#x27;)</p><h4>Figure 3: Data visualization after single plot</h4><p>To style the plot, matplotlib supports format strings like &#x27;k--&#x27;, which plots a black dashed line:</p><h4>Figure 4: Data visualization after additional plots</h4><p>The axes array can be easily indexed like a 2-D array, for example, axes[0, 1]. Like this, we can indicate the subplots with same x- or y-axis using sharex and sharey, respectively. This is</p><p>particularly useful when you compare data on the same scale; otherwise, matplotlib autoscales plot limits independently. Refer Table 1 for structure.</p><h4>Table 1. pyplot.subplots options</h4><h3>B) Adjusting the spacing around subplots:</h3><p>By default, matplotlib adds spacing around and between subplots. This is scaled relative to the figure size and adjusts dynamically if you resize the plot.</p><p>To fine-tune this spacing, use the subplots_adjust() method. It can be called from the figure object or as a global function:</p><p>plt.subplots_adjust(left=..., right=..., top=..., bottom=..., wspace=..., hspace=...)</p><ul><li>wspace controls horizontal spacing (width between subplots)</li><li>hspace controls vertical spacing (height between subplots)</li></ul><p>Example: To remove all space between subplots:</p><h4>Figure 5: Data visualization with no inter-subplot spacing</h4><h3>1.2. Colors, Markers, and Line Styles</h3><p>Matplotlib\u2019s core plot function accepts arrays of x and y coordinates and alternatively a string abbreviation indicating color and line style. For instance, to plot x versus y with green dashes, execute:</p><p>ax.plot(x, y, &#x27;g--&#x27;)</p><p>While combining color and line style in a single string offers convenience, it&#x27;s not always ideal\u2014 especially when generating plots programmatically. In such cases, it&#x27;s often better to specify styles separately rather than assembling them into one string. The same plot can be created more clearly using explicit style parameters.</p><p>ax.plot(x, y, linestyle=&#x27;--&#x27;, color=&#x27;g&#x27;)</p><p>Line charts can include markers to emphasize individual data points. Because matplotlib connects points with continuous lines, it\u2019s not always obvious where the actual data values are positioned. To make this clearer, markers can be added directly within the style string\u2014this string typically follows</p><p>the order of color, marker type, and then line style (refer to Figure 6 for illustration).</p><h4>Figure 6: Line plot with markers</h4><p>For line plots, subsequent points are linearly interpolated by default, which can be changed with the drawstyle option (Figure 7):</p><h4>Figure 7: Line plot with different drawstyle options</h4><h3>1.3. Ticks, Labels, and Legends</h3><p>When it comes to customizing plots in matplotlib, there are generally two approaches you can take: the procedural method using the pyplot module (e.g., matplotlib.pyplot), or the more object-oriented method using the core matplotlib API.</p><p>The pyplot interface is designed for quick, interactive plotting and includes functions like xlim, xticks, and xticklabels, which control aspects such as axis limits, tick positions, and tick labels.</p><p>These functions can be used in two ways:</p><ul><li>Without arguments: Returns the current setting (e.g., plt.xlim() gives the current x- axis limits).</li><li>With arguments: Updates the setting (e.g., plt.xlim([0, 10]) sets the x-axis range from 0 to 10).</li></ul><p>By default, these functions apply to the most recently active AxesSubplot object. Internally, each of these commands has an equivalent pair of methods on the subplot object itself. For example, xlim corresponds to ax.get_xlim() and ax.set_xlim().</p><p>While both methods are valid, using the object-oriented approach with subplot instances (e.g., ax.set_xlim) is often clearer\u2014especially when dealing with multiple subplots. It allows for more precise control, though users can choose whichever style they find more comfortable.</p><h3>A) Setting the title, axis labels, ticks, and ticklabels</h3><p>Refer, figure 8 for customizing the axws.</p><h4>Figure 8: Simple plot for illustrating xticks (with label)</h4><p>To change the x-axis ticks, use set_xticks and set_xticklabels.</p><p>Example,</p><h4>In [40]: ticks = ax.set_xticks([0, 250, 500, 750, 1000])</h4><p>In [41]: labels = ax.set_xticklabels([&#x27;one&#x27;, &#x27;two&#x27;, &#x27;three&#x27;, &#x27;four&#x27;, &#x27;five&#x27;], ....: rotation=30, fontsize=&#x27;small&#x27;)</p><p>The rotation option rotates the x tick labels at a 30-degree. Lastly, set_xlabel gives a name to the x-axis and set_title the subplot title (Refer figure 9)</p><p>: In [42]: ax.set_title(&#x27;My first matplotlib plot&#x27;)</p><h4>Out[42]: In [43]: ax.set_xlabel(&#x27;Stages&#x27;)</h4><h4>In [43]: ax.set_xlabel(&#x27;Stages&#x27;)</h4><h4>Figure 9: Simple plot for illustrating xticks</h4><h3>B) Adding legends</h3><p>Legends are one of the critical elements to identify plot elements. There are a many ways, and the easiest is to pass the label argument when adding each piece of the plot:</p><p>After that, either call ax.legend() or plt.legend() to create a legend automatically (Refer figure 10)</p><h4>Figure 10: Simple plot with three lines and legend</h4><h3>1.4. Annotations and Drawing on a Subplot</h3><p>To draw your plot annotations, which could consist of text, arrows, or other shapes, add annotations and text using the text, arrow, and annotate functions. \u2018text draws text\u2019 at specified coordinates (x, y) on the plot with optional custom styling:</p><p>The annotations shown above add both text and arrows to the plot in a visually organized way. For instance, you could visualize the S&amp;P 500 closing prices from 2007 onward (data available via Yahoo! Finance) and mark significant events from the 2008\u20132009 financial crisis directly on the graph. The entire example can be conveniently executed in a single cell within a Jupyter notebook (Refer figure 11).</p><p>Figure 11. Important dates in the 2008\u20132009 financial crisis</p><p>To draw geometric shapes, matplotlib offers built-in objects for many standard forms such as Rectangle and Circle. While some are accessible through matplotlib.pyplot, the complete collection is available in the matplotlib.patches module. To include a shape in your plot, you first create the patch object (e.g., shp) and then attach it to a subplot using ax.add_patch(shp) (refer to Figure 12 for illustration).</p><p>Example:</p><p>Figure 12. Data visualization composed from three different patches</p><h3>1.5. Saving Plots to File</h3><p>You can export the current figure to a file using the plt.savefig function, which performs the same action as calling the savefig method on a figure object. For instance, to save a plot in SVG format, simply use:</p><p>The file type is automatically determined by the file extension you provide. So if you save it with a .pdf extension instead, a PDF file will be generated.</p><p>When preparing figures for publication, two commonly adjusted options are:</p><ul><li>dpi: Controls the resolution in dots per inch.</li><li>bbox_inches=&#x27;tight&#x27;: Removes excess whitespace around the figure.</li></ul><p>To save a high-resolution PNG file with minimal padding, you could write:</p><p>In addition to saving directly to a file, savefig can also output the plot to a file-like object such as a BytesIO stream. This is useful when you need to process the image in memory:</p><p>For more customization options, refer to the full list in Table 2.</p><h4>Table 2. Figure.savefig options</h4><h3>1.6. matplotlib Configuration</h3><p>By default, matplotlib is set up with color palettes and layout options suited for creating figures intended for publication. However, nearly every default setting\u2014such as figure dimensions, spacing between subplots, font size, color schemes, grid appearance, and more\u2014 can be fully customized.</p><p>One way to adjust these settings programmatically is by using the rc() function. For example, to globally set the default figure size to 10 by 10, you would write:</p><p>The first argument passed to rc() specifies the component to customize (like &#x27;figure&#x27;, &#x27;axes&#x27;, &#x27;xtick&#x27;, &#x27;ytick&#x27;, &#x27;grid&#x27;, or &#x27;legend&#x27;). Additional settings can be supplied as keyword arguments.</p><p>Another convenient approach is to define settings in a dictionary and apply them with unpacking. For example:</p><p>For broader and more persistent customization, matplotlib provides a config file named matplotlibrc, located in the matplotlib/mpl-data directory. You can also create your own version of this file (named .matplotlibrc) and save it in your home directory. When matplotlib starts, it will automatically apply these custom settings.</p><p>As you&#x27;ll learn later, the seaborn library builds on matplotlib and includes several pre-defined themes and styles, all managed through this same configuration system.</p><h3>2. Plotting with pandas and seaborn</h3><p>matplotlib operates at a relatively low level, requiring users to build a plot by combining its fundamental elements\u2014such as the data visualization type (e.g., line, bar, scatter, box, contour), along with the title, axis labels, legends, and other annotations.</p><p>In contrast, pandas makes visualization easier, especially when working with DataFrames or Series that include multiple data columns and labeled rows and columns. It offers built-in plotting functions that streamline the process.</p><p>Additionally, the seaborn library\u2014developed by Michael Waskom\u2014is a high-level interface built on top of matplotlib. It simplifies the creation of commonly used statistical plots, making it easier to produce attractive and informative graphics.</p><h3>2.1. Line Plots</h3><p>Both Series and DataFrame objects in pandas include a plot attribute that allows users to create basic visualizations. When you call the plot() method without specifying a plot type, it defaults to generating a line plot (as shown in Figure 13).</p><h4>Figure 13. Simple Series plot</h4><p>By default, the Series index is used as the x-axis values in the plot. If you prefer not to use the index, you can disable it by setting use_index=False. Axis tick marks and range limits can be customized using parameters such as xticks and xlim for the x-axis, and yticks and ylim for the y-axis. Table 3 provides a complete list of available plotting options. While some of these options are explained further in this section, you are encouraged to explore the rest independently.</p><p>Additionally, most plotting functions in pandas accept an optional ax argument, which allows you to pass a matplotlib subplot object. This is especially helpful when organizing multiple plots within a grid layout.</p><p>When using plot() on a DataFrame, each column is plotted as a separate line within the same subplot, and a legend is automatically generated (as demonstrated in Figure 14).</p><h4>Figure 14. Simple DataFrame plot</h4><h4>Table 3. Series.plot method arguments</h4><p>DataFrame allows some flexibility to handle the columns; for example, whether to plot all columns on the same subplot or to create separate subplots (refer to table 4 for more details).</p><h4>Table 4. DataFrame-specific plot arguments</h4><h3>2.2. Bar Plots</h3><p>To create vertical and horizontal bar plots, use plot.bar() and plot.barh() respec tively. Here, the Series or DataFrame index will use as the x (bar) or y (barh) ticks (Figure 15):</p><h4>Figure 15. Horizonal and vertical bar plot</h4><p>The options such as color=&#x27;k&#x27; and alpha=0.7, gives black color to the plots and use partial transparency for filling.</p><p>When creating a bar plot from a DataFrame, the values from each row are displayed as grouped bars, positioned side by side to represent each data point (Figure 16).</p><h4>Figure 16. DataFrame bar plot</h4><h4>Here, \u201cGenus\u201d is the title of the legend</h4><p>To   generate    stacked   bar    plots    from   a   DataFrame   use   stacked=True   (Figure   17)</p><h4>Figure 17. DataFrame stacked bar plot</h4><p>To make a stacked bar plot showing the percentage of data points (for example, each party size on each day)</p><h4>Then, normalize (Figure: 18)</h4><h4>Figure 18. Fraction of parties by size on each day</h4><p>For aggregation or summarization before making a plot, using the seaborn package. For example, tipping percentage by day (Figure: 19)</p><h4>Figure 19. Tipping percentage by day with error bars</h4><p>To split by an additional categorical value, seaborn.barplot use the hue option (Figure 20).</p><h4>Figure 20. Tipping percentage by day and time</h4><p>Scatter plot : One of the most significant data visualization methods is scatter plot and it is regarded to be one of the Seven Basic Tools of Quality. The relationship of two variables is plotted in the chart called a scatter plot on two dimensional graph commonly referred to as Cartesian Plane on mathematical basis.</p><p>It is normally employed to draw the association between one independent variable and one dependent variable with an independent variable plotted on x- axis and a dependent variable plotted on y-axis so that you can determine the influence that the independent variable has on the dependent variable. These are called Scatter Plot Graph, or Scatter Diagram.</p><p>Scatter Plot has other names and some of them include; scatter chart, scattergram, scatter plot, and XY graph. Scatter plot is the graphical representation of a data pair where each element of the pair is assigned an axis that normally is the independent axis, called the x-axis and the other axis, the dependent axis, called the y-axis.</p><p>Such type of distribution facilitates the easy determination of the type of relationship, the data pair in plotted format is assuming. Thus the Scatter Plot comes in handy when we have to determine the relationship between any two sets of data or in cases where we are suspecting that there might be some relationship between the two variables and the relationship might be the gist of a problem being encountered somewhere.</p><p>We need to observe the steps below in order to create a scatter plot.</p><h4>Identify the independent and dependent variables (step 1)</h4><h4>Step 2: On x-axis put the independent variable</h4><p>Step 3: Leave the y-axis blank and plots the dependent variable</p><p>Step 4 The significant connection between the provided variables should be pulled out.</p><h4>Forms of Scatter Plot</h4><p>The Scatter Plot on the basis of correlation of two variables will fall under the types as following.</p><h4>Scatter Plot Of Positive Correlation</h4><h4>Scatter Plot Of Negative Correlation</h4><h4>Scatter Plot of Null Correlation</h4><h4>Scatter Plot of Positive Correlation</h4><p>In such kind of scatter-plot values on Y axis rises as one moves along from left to right. Technically speaking, when two variables are directly proportional to each other then there will be positive correlation as portrayed in the scatter plot. The familiarity is further discussed in the form of Perfect Positive, High Positive and Low Positive.</p><h4>Scatter Plot Of Negative Correlation</h4><p>In such scatter-plot, the y measure declines as we go left to right. Valuation of one variable against the other is reducing, in layman terms. There are further forms of positive correlation that are referred to as Perfect Negative, High Negative and Low Negative.</p><h4>Scatter Plot of Null Correlation</h4><p>Values in such a category of scatter-plot are distributed everywhere in the graph. Generally such a type of graph indicates that there exists no correlation between the two variables drawn in the Scatter Plot.</p><h4>What is an Analysis of Scatter Plot?</h4><p>The use of scatter plot analysis entails analysis of how the points on the graph are distributed and arriving to the general picture in order to get insights into the association between the variables. Scatter Plot helps to visualise correlated variables of two variables; however, in life, we are not that lucky to obtain only a correlation between variables. Such are the cases in real life cases, and more than two variables can be the part of correlation.</p><p>Facet grids and Categorical data:</p><p>FacetGrid object requires a dataframe and the labels of the variables which will appear in the row, column or hue dimensions of the grid.</p><p>The variables must be categorical and the data at every level of the variable is to be used as a facet along that dimension.In the given example we have simply created the facetgrid object which does not draw on them.</p><p>Forming visual data of this grid is mainly done using the FacetGrid.map() approach. Let us turn to the tip distributions on each of these subsets, a histogram can be used.</p><h4>Other Python visualization tools</h4><p>In data science, distribution of your data is very important. Histograms are useful in visualizing frequency distributions as are box plots (box-and-whisker). Violin plots deliver one step further the box plots in combination with the kernel density estimate (KDE), providing a more detailed outlook into distribution shape. It is also useful that KDE plots can easily be used to display smoothly calculated distributions, particularly when we want to compare several groups of data.</p><p>In categorical data, strip plot and swarm plot give the information about data distribution inside categories. Strip plots provide not-overlapping points by making it rougher (jitter) whilst swarm plot arrange the data in order to avoid overlapping at all, these are the best when one has small-to- medium provided data to work with. The stacked area chart is applied when comparing over time the composition of several categories. When data is hierarchical, then the proportion is visualized in tree maps and sunburst charts, and it is useful in showing categories and subcategories.</p><p>When dealing with geographical data, one idea is that of color-coded regions (such as countries or states) these processes work out well via the use of choropleth maps. Point maps can be used to see a specific geographical location on a latitude-longitude scale in maps and heatmaps are maps that show the intensity of data, like the number of people in some locations. These involve libraries such as folium, geopandas, plotly to make the tasks easier.</p><p>When working with analyzed relationships or interactions (e.g. social networks or web traffic), network graphs can be very helpful. You can render interconnectivity between entities (node) and connections (edge) using networkx or pyvis in an interactive way. On the same note, correlation tables that are sometimes represented in the form of heat maps can make you rapidly understand the quality of the association between numerical variables. Hierarchical clustering utilizes dendrograms, which are used to indicate the formation of data clusters depending on similarity.</p>", "<h4>Module 4</h4><h4>Statistical Thinking</h4><h4>Distributions \u2013 Representing and plotting histograms</h4><p>Histogram data is a fundamental tool in visualization, which provides a simple yet powerful way to understand the distribution of data. Whether you are new to data analysis or looking to sharpen your skills, histogram is an important tool for summarizing and imagining the data points.</p><p>A type of histogram is a type of graphical representation that refers to the distribution of numerical values. It consists of a set of vertical bars, where each time represents a range of values, and the height of the bar indicates the frequency or count of data points falling within that range.</p><p>Histograms are usually used to imagine the size of the data set in data and data analysis and identify the pattern, such as the presence of outlair or obliqueness. They are also useful to compare the distribution of various data sets or to identify trends over time.</p><p>The picture above shows how 1000 random data points from a general distribution and standard deviation of 1 are plotted into a histogram with 30 coaches and black edges.</p><p>We can create a histogram using Matplotlib by following a series of steps. Following the import details of libraries, the code generates a set of 1000 random data points from a general distribution with 0 and standard deviations, using 0 and standard deviations.</p><p>Python has a powerful tool for making plt.hist () function histogram. By providing data, number of compartments, bar color, and edge color as input, this function produces a histogram plot.</p><p>To enhance visualization, Xlabel (), ylabel (), and title () functions are used to add the labeled to X and Y axes, as well as a title for the plot.</p><p>Finally, the show () function is employed to display histograms on the screen, which allows for detailed analysis and interpretation.</p><h4>Outliers</h4><p>Outlier are extreme values that differ from most other data points in a dataset. They can have a major impact on your statistical analysis and slant the results of any hypothesis tests. It is important to carefully identify the potential outliers in your dataset and to treat them properly for accurate results. There are four ways to identify outliers: Sorting method Data visualization system Statistical test (jade score) Contradictory limit system The outlier has values at the extreme ends of a dataset.</p><p>Descriptive figures often involve using some numbers abbreviated to distribution. An important aspect of a distribution is where its center is located. Central trend measures are first discussed. Another aspect of a distribution is how it spreads. In other words, how different the number in distribution is from each other. The second section describes measures of variability. Distribution can vary in size. Some distribution are symmetrical while others have long tails in just one direction. The third section describes measures of distribution size. Concern of the last two volumes (1) how changes affect the measures summarizing distribution and (2) variance sum law, a significant relationship that includes a measure of variability.</p><h4>Variance</h4><p>The variance is a statistical measurement that is used to determine the spread of numbers in a data set in relation to the average value or mean. The standard deviation class will give us variance. Using the variance we can evaluate how or squeezed the distribution.</p><p>Statistics can have two types of versions, namely, sample variance and population variance. The symbol of variance is given by \u03c32. The variance is widely used in hypothesis tests, examining the good of the fit, and monte carlo sampling. To check how individual data points vary in relation to using variance. In this article, we will take a look at the qualities of definition, example, formula, application and variance. Variation is a solution to spread. A remedy for spread is a volume that is used to check the variability of data about the average value. Data can be of two types - grouped and ungreed. When data is expressed as square interval, it is known as grouped data. On the other hand, if the data has individual data points, it is called non -unguided data. Both sample and population variance can be determined for data.</p><h4>Probability mass function \u2013 Plotting PMFs</h4><p>The probability mass function (PMF) represents a distribution by sorting the data into the compartment (a lot of frequency is like histogram) and then combines a possibility with each bin in delivery. A possibility is a frequency expressed as a fraction of sample size n. Therefore we can directly convert a frequency histogram by dividing the count in each bin in PMF by dividing sample size n. This process is called normalization.</p><p>The syntax for plotting PMF using ggplot2 is almost the same what you will use to create a frequency histogram. An amendment is that you need to include y = .. density .. inside AES (). As a simple example, let&#x27;s do the complete distribution of average work time in advance and plot it as PMF:\\</p><h4>Other visualizations</h4><h3>1. Line Graph</h3><p>The line graph is the favorite law in the enumeration of graphs as well as various different number of business applications due to the fact they present a trend in a total examined manner.</p><h4>What is line graph?</h4><p>A line chart (also called a line graph) is a graph that is used to represent the values of something against a given time span.</p><p>In the case of your firm, your sales department might place a graph of how the number of sales you have on hand varies with time. The values are shown in forms of data points, connected with straight lines.</p><h4>When is line graphs use?</h4><p>You should use it when you need to show trends.You want to present trends of various categories at the same time of a period and to present comparison.</p><h4>Bar Chart</h4><p>Bar charts are quite popular types of data displays since you can read them without much effort and draw useful information and they are excellent to compare multiple various types of data.</p><h4>What is a bar chart?</h4><p>Bar chart (or bar graph) is a type of a chart used to display data in a form of bars of various height.</p><p>The bars are of two types i.e. vertical or horizontal. You do not have to use a particular type.</p><p>We can easily compare data on each variable at every point of time by the help of bar chart.</p><p>As an example, a bar chart might seek to compare the sales of your company in this year to the last year.</p><h4>What time to use a bar chart?</h4><p>When it is necessary to compare various categories.</p><p>In the event that you have to demonstrate the size of change in data with time.</p><h4>Column Chart</h4><p>The column chart is a special kind of bar graph where vertical bars are used to indicate comparison of categories.Whatever can be counted can be represented in column chart.</p><p>The column charts are the most appropriate means of depicting the scenario at any given moment (such as the quantity of items sold on a web-shop).</p><p>The primary aim of their usage is to focus on the overall numbers as opposed to the trend (trends are better represented by a line chart).</p><h4>What is the situation to apply a column chart?</h4><p>You have to demonstrate the comparison side-by-side when you have to compare two different values.</p><p>When you would like to underline the distinction between values.</p><p>When you wish to point out the cumulative numbers as opposed to the trends.</p><p>One of the beautiful types of data visualization is presented in pie charts. On a high level, they are readable easily and they are used in area representational descriptions of relative sizes.</p><p>pie chart:</p><p>A Pie Chart is a round shaped graph which depicts relativity of sizes of data in terms of pieces of pies.</p><p>Pie chart is an ideal tool with regard to displaying percentages since it displays each component as a component of the entirety.</p><p>The whole pie constitutes 100 percent of a whole. The slices in the pie symbolize parts of the entirety.</p><h4>When not to use pie chart?</h4><p>To indicate the percentage that each of the values contributes to the entirety.</p><p>When you would like to illustrate the breaking up of a group into smaller parts.</p><p>Area Chart:</p><p>An area chart is an optimal choice in case you have to represent the data reflecting a time-series relationship.</p><h4>What is area chart?</h4><p>An area chart is that kind of a chart that shows the variation of one or more quantities with time. It is like a line graph.</p><p>In area charts as well as line graphs, the data values are linked by a line to indicate the value of a quantity at various times. Both of them are good when it comes to displaying trends.</p><p>Nevertheless, the area type graphic is not similar to the line graph, as the space between the x-axis and the line is colored. Area charts hence provide a feeling about the total volume.</p><p>Area charts focus on a trend through time. They do not pay so much attention to a presentation of exact values.</p><p>The area charts are also ideal where there is need to exhibit the variation of the different sets of data.</p><h4>Where to apply an area chart?</h4><p>In instances where you need to apply a series of lines to draw a comparison between groups (tells aka series).</p><p>You need to know the breakdown of the total by groups as well as their whole value when you desire to follow such a value.</p><h4>Scatter Plot</h4><p>Scatter plot is also one of the commonly used types of data visualization and it is also referred to as a scatter diagram, scatter graph and correlation chart.Scatter plot is useful in various spheres of the modern world business, biology, social statistics, data science, and etc.</p><h4>What is Scatter plot?</h4><p>Scatter plot is a graphical depiction stating a relationship amid two variables. It is aimed at demonstrating the extent of influence that one variable has over another.</p><p>In most cases, in the same formula when there exists an association between 2 variables, the former is referred to as the independent variable. The second variable, as it is known, is called a dependent variable since the values obtainable depend on another variable.</p><p>However, there is also a possibility of no kind of relationship between 2 variables.</p><p>Usage of a Scatter plot.</p><p>You ought to use it when you are required to note and demonstrate relationships between two numerical variables.</p><p>When one simply wants to graphically represent the relationship between 2 datasets that are large in nature without relating to time.</p><p>Bubble Chart:</p><p>The class size paradox Class size paradox Characteristics Paradox A result of statistics Surprise countParadoxClass sizeA statistical anomalyThe class size paradox is an unexpected statistical occurrence</p><p>generally employed in the scope of data science and probability to point out bias in averaging and sampling algorithms. It is in close connection with the sampling bias and the paradox of friends.</p><p>Definition: The class size paradox is the fact that the size of the average class experienced by students is bigger than the size of the average calculated on all classes.</p><p>Sampling Bias: In case you sample individuals instead of groups, your estimates will be biased.</p><p>Weighted Averages: Misapplication of averages which do not take into account weights may result in false conclusion.</p><p>Survey Design: In the analysis of survey or user data (e.g. product usage, class feedback) the assumption that the distribution of participants can be skewed is also valid.</p><p>the average class size is 20, the average student&#x27;s experience is closer to 23.3.</p><p>Misleading Metrics: In business intelligence/A/B testing, results may seem skewed when the data has not been normalized correctly. Data frame indexing</p><p>An efficient way to manipulate data is a top priority in data science, and indexing in DataFrames (as in pandas) can speed up and rationalise how we extract, filter and manipulate data.</p><p>What is DataFrame? DataFrame is a 2 dimensional tabular data structure that has:</p><p>Columns (labeled with an index),</p><p>Columns (marked with headers),</p><p>Just like an excel sheet or an SQL table.</p><h4>Types of Indexing</h4><h3>1. Label-Based Indexing (.loc) Uses row and column labels (names).</h3><h4>Syntax: df.loc[row_label, column_label]</h4><p>2.Integer-Based Indexing (.iloc) Uses row and column positions (like array indexing). Syntax: df.iloc[row_index, column_index]</p><h3>3. Boolean Indexing (Filtering) Index rows using logical conditions.</h3><h3>4. Set Index You can also set a column as an index for faster lookup.</h3><h4>Cumulative distribution functions - Limits of PMFs</h4><h4>Constrains of PMFs</h4><p>In case the number of values is not large, PMFs will work well. However, the more the values that have to be calculated, the less the probability of each value and the high effect of random noise.</p><p>As an example we may be interested in distribution of birth weights. NSFG data Total wgt lb variable stores the weight of a baby at birth, in pounds. The PMF of this quantity of first babies and other is given in Figure below.</p><p>PMF of birth weights In general, such distributions take the shape of a bell of a normal distribution, where the values are higher along the mean and far apart in both ends.</p><p>However, components of this figure are not easy to read. Numerous spikes and valleys are present and there are some differences that can be considered visible between the distributions. Which of these features are meaningful, it is hard to tell. Too, it is difficult to observe total trends; e.g., which variance is it that you think has the larger average?</p><p>Binning of the data can overcome these problems; i.e., putting data range into non- overlapping (binned) intervals and tabulating the number of values within each bin. Binning may be helpful but bin size is something difficult to correct. By smoothing out the noise they</p><p>may also smooth out the useful information, too, should they be large enough.</p><p>This is essentially equivalent to PercentileRank, but the output stands in the interval [0,1] instead of having the percentile rank in the interval [0,100].</p><p>To make an example, consider the sample to be taken as [1, 2, 2, 3, 5]. These are some of its CDF values:</p><p>CDF(0) = 0 The CDF (1) = 0.2 The CDF(2) = 0.6 The CDF(3) = 0.8 CDF(4) = 0.8 The likelihood that five goals are scored is 1 We are in a position to assess the CDF of any x and not necessarily the values that are present in the sample. CDF(x) is zero when x is less than minimum in the sample. In the case of x that exceeds the largest value, CDF(x) is 1. Representing CDFs Cdf basic procedures offered are:</p><p>Prob (x): for a given value x, the probability is calculated as p = CDF (x). The bracket operator is synonymous to Prob. Value(p): Computes the value, x corresponding to a probability, p; i.e. the inverse CDF of p.</p><p>The constructor of Cdf accepts the argument of a list of values, a pandas Series, a Hist, Pmf or another instance of Cdf. The next listing creates a Cdf of the distribution of the length of pregnancy in the NSFG:</p><p>thinkplot has a function Cdf which graphs Cdfs as lines:</p><p>Percentile based statistics Percentiles refer to the proportion of the scores which lie below a given score. They are a sort of quantile which divides the data into 100 roughly equal sized cell and informs you the location of a score relative to other scores. To illustrate this, somebody who has an IQ of 120 is on 91 st percentile indicating that his or her IQ is greater than 91 other scores.</p><p>When you want the relative position of a number, percentiles are a fine thing to have. Percentiles give you an idea about how a value stands against other values. The simple rule is that where X appears at kth percentile then, X exceeds K percent of the values. Now, let us view how this information may be useful. . As a result there are various ways of computing percentile. This post lists four procedures. The first three are the practices that analysts resort to in finding the percentiles when examining the actual values of data in moderately sized data sets. The k th percentile is defined differently by the above three definitions as below:</p><p>The lowest value that exceeds more than k-per cent of the values. The least amount that supersedes or equals to k percent of values. A computed value between two nearest ranks.</p><p>Random numbers The importance of random numbers in data science Researchers, amateurs, and students use random numbers to create such models as random sampling and generate synthetic data and initialize machine learning models. Random numbers are values to which a number is created so that all the numbers are likely to be chosen equally.</p><p>They are typically pseudo-random in data science explains in data science, the algorithms are typically pseudo-random (i.e. not really random yet sufficiently random to be useful in practice).</p><p>Generating Random Numbers:</p><p>Comparing percentile ranks:</p><p>Percentile ranks are a strong statistical concept in data science and they compare values with reference to a distribution. Two percentiles represent the proportions of observations shown by a dataset that are less than a particular value.</p><p>Suppose a student scored at the 90th percentile, or above 90 percent persons and he is better than them.</p><p>Comparison of Percentile Ranks:</p><p>Modeling distributions - Exponential distribution Its probability distribution is used when modelling the time between independent events in a Poisson process, in data science and in statistics (i.e., when events occur one at a time at a constant mean rate).</p><ul><li>Exponential distribution is applicable in modelling the time to event.</li><li>It has the assumption that events are independent and occur at random.</li><li>The rate of occurrence = \u03bb (lambda).</li><li>Unlike other continuous distributions it is memoryless.</li></ul><h4>Modeling Exponential Distribution in Python</h4><p>Normal distribution The Gaussian distribution also referred to as the normal distribution is a bell-shaped probability distribution that is symmetrical about the mean.</p><p>It is one of the most significant distributions in statistics and data science since there were many natural and social phenomena that this distribution tends to follow.</p><p>Implementation:</p><p>Lognormal distribution. P probability distribution -A lognormal distribution is a continuous probability distribution of a random variable, such that the logarithm of the variable follows a normal distribution.</p><p>Implementation:</p>", "<h4>Module 5</h4><h4>Time Series Analysis And Predictive Modeling</h4><p>Time Series Analysis refers to a way of data analysis by considering the points after a fixed time period (e.g.; daily, monthly, annual) in order to derive certain pattern, trends to construct forecasts.</p><p>Time series analysis and forecasting play the most important role in predicting future trends, behaviours and behaviours using the past data. It assists companies to make informed decision, efficient resource allocation, as well as avoid risks, through its ability to predict market demand, sales volatility, stock changes, and so many others. It also helps to plan, budget and strategize in different fields including finance, economics, health, climatic science, and resource usage and promotes efficiency and competitiveness.</p><p>Properties of Time Series Data:</p><p>Temporal Order: The information is sequenced with time (chronologically).</p><p>The observations rely on time (a past observation affects other future observations).</p><p>Regular Intervals: The data are taken regularly (i.e., hour-to-hour, day-to-day, month-to-month).</p><p>The data points are given as the result of watching or recording something in time, like the price of a stock, the temperature in a room, or the amount of sales being made. Time series data Time series data is typically displayed graphically, with time represented on an axis and the variable of interest on an axis so analysts can determine trends, patterns, and time changes.</p><p>The representation of the time series data is commonly performed in the form of a line plot where the time is shown on the horizontal axis (x-axis) and the values of the variable on the vertical axis (y- axis). The graphical representation allows the visual interpretation of trends, patterns and fluctuations in the variable over time to assist in the analysis and interpretation of the data.</p><h4>Importance of Time Series Analysis</h4><p>Forecast Future: Time series analysis can be used to derive the future trend and modeling future behavior of businesses in order to help them to be proactive in their decision making such as anticipating the market need, stock prices and other variables.</p><p>Identify Patterns and Anomalies: Time series analysis can also aid in identifying repeat patterns and outliers by scrutinizing series of information points which render insight into underlying dynamics and possible outliers.</p><p>Risk Mitigation: Through the identification of risks, the businesses are able to come up with mitigation strategies to deal with risks, and this plays a significant role in the management of risks.</p><p>Strategic Planning: Behaviors and patterns derived out of time series help in long term strategic planning, thus making decisions about what to do in the finance world, healthcare and other sectors.</p><p>Competitive Advantage: Time series analysis helps companies to better allocate resources both with regard to inventory, staff and monetary resources. Businesses can make decisions based on data and be ahead of the market trends and react to changes to gain a competitive advantage.</p><h4>Elements of Time Series Analysis</h4><p>Trend: Whereas a non-uniform interval does not exist and any deviation of the given set of data is any constant flow of time. The trend would be negative or positive or null trend</p><p>Seasonality: That is some repetitive or deterministic period change in the data on an ongoing time- line. Would be Bell curve or saw tooth</p><p>Cyclical: Under which there is no specific time, a lack of certainty in the direction and trend of movement</p><p>Irregularity: The sudden occurrence/event/scenario and spikes within a brief period of time.</p><h4>Types of Time Series Analysis</h4><p>Since time series analysis involves numerous categories or versions of data, there is a situation where an analyst has to construct a complicated model. Nevertheless, not all the variances can be explained by analysts, and they are not able to generalize a particular model to all samples. Too complex models or models that attempt too much are also a fit problem. Failure to fit (lack of fit) or failure to partition random error and true relationship (overfitting) models means that models fail to draw the distinction whereby analysis is skewed and forecasts are inaccurate.</p><p>Examples of time series analysis models are:</p><p>Classification: Investigates and allocates patterns to the data.</p><p>Curve fitting: Graphs the information in a curve to analyze the relations of variables in the data.</p><p>Descriptive analysis: Determines the trends, cycles or seasonal variation in the data of time series.</p><p>Explanative analysis: Tries to grasp the information and internal relations in it, cause and effect.</p><p>Exploratory analysis: Displays the key features of the time series data, typically in graphic form.</p><p>Forecasting: It guesses values to come. This is the trend-type which is historically oriented. It applies the past in modeling the future data, forecasting of situations that may occur in future plot points.</p><p>Intervention analysis: examines how data can be altered by an event.</p><p>Segmentation: Divides the data into portions to demonstrate the property of source information.</p><h4>Data classification</h4><p>Time series data can be identified with two broad categories:</p><p>The data on stock times series implies that the values of the attributes are measured at a defined time, such as a fixed picture of the data as it was during the time.</p><p>Flow time series data entails a record of the activity of the attributes within a specified duration which is usually a component of the whole and forms a section of the outcomes.</p><p>In a time series, the variations may appear randomly in data:</p><p>Through functional analysis, one will be able to select patterns and relationships in data so as to find significant events.</p><p>Trend analysis refers to ascertaining uniform change at a particular direction. The two classifications of trends are the deterministic and stochastic trends; the latter is random and cannot be explained, and the former can be traced to its ultimate cause.</p><p>Seasonal variation refers to occurrences of certain and periodic times in the period of one year. Serial dependence is a situation where subsequent points in time are likely to be linked.</p><h4>Time Series Forecasting</h4><p>Time Series Forecasting refers to a statistical time series method that is able to provide pointer to future series using past series values. Simply put, thinking of it is gauging into the future of data value in time. Time Series Forecasting can be used to Figure out future trends using trends and patterns identified in past records and help in decision-making and planning by leading to educated guesses concerning what is likely to occur.</p><h4>Various Time Series Forecasting Algorithms</h4><p>Autoregressive (AR) Model: Autoregressive (AR) model is a model included in the time series with the help of which further values can be predicted on the basis of linear combinations of prior values of the same time series. AR(p) A time series is modeled in an AR(p) model as a linear combination of its past p values, plus a random error term. Autoregressive model Because it is the order of the models (p), there is the number of previous values that are included in the prediction process.</p><p>Autoregressive Integrated Moving Average (ARIMA): ARIMA models are popular models of time series forecasting. It estimates the following term in a time series with the combination of its past values as well as the previous forecast errors. The parameters of the model are order of autoregression (p), differencing (d) and moving average (q).</p><p>ARIMAX: extension of ARIMA to incorporate exogenous variables that may result in a more accurate set of forecasts.</p><p>Seasonal Autoregressive Integrated Moving Average (SARIMA): SARIMA is an extension of ARIMA where seasonality is accounted in the model. It has extra seasonal parameters (P, D, Q) to repay periodic changes in the data.</p><p>SARIMAX: An augmentation of SARIMA used with seasonal time series forecasts that uses exogenous variables.</p><p>Vector Autoregression (VAR) Models: VAR models are autoregression of multivariate time series data where each of the variables is a linear combination of its own past values and the past values of the other variables. They become applicable when there is a need to examine and predict interdependencies between several time series.</p><p>Theta Method: The most basic and the obvious forecasting method that is obtained through extrapolation and trend approximation.</p><p>Exponential Smoothing Techniques: Exponential smoothing techniques, according to the names Simple Exponential Smoothing (SES) and Holt-Winters, predict the upcoming values with exponentially declining weighting on historical values. Such approaches are especially helpful when dealing with trended and seasonal data.</p><p>The Gaussian Processes Regression: Gaussian Processes Regression is another Bayesian non- parametric method of modeling functions distributions through time. It gives the uncertainty estimates together with point forecasts, hence it is applicable in capturing the time series forecast uncertainty.</p><p>Generalized Additive Models (GAM): is a general modeling tool that uses additive components, which makes it possible to have a nonlinear relationship and interactions.</p><p>Random Forests: Random Forests is a method of related machine learning where multiple decision trees are grown during training and the average of the predictions of the multiple trees are returned. It is suitable to forecast using time series as the data can contain complicated relationships and interaction between the data.</p><p>Gradient Boosting Machines (GBM): GBM represents the next ensemble-based learning method which by sequentially constructing several decision trees, where each one can rectify the more recent mistakes of the preceding tree. It has excellent performance and has high resistance to overfitting in determining nonlinear relationships.</p><p>State space models: These state space models are a description of a time series as a mixture between unobserved (hidden) states and observed measurements. These models reflect in</p><p>reference to the deterministic and stochastic part of the time series, which means that they can be used in forecasting and observation of any anomalies.</p><p>Dynamic Linear Models (DLMs): DLMs are a state-space Bayesian model that use a model of time series data which is a representation of a latent state. They are flexible in that they can absorb different trends, seasonality and other moving trends in the data.</p><p>Recurrent Neural Network (RNNs) and Long Short-Term Memory (LSTM) Networks: RNNs and LSTMs allow working with sequential data, which is another deep learning structure. They are able to learn intricate time-varying patterns in time series data and hence are effective in forecasting problems particularly on large scale and high dimensional data.</p><p>Hidden Markov Model (HMM): An Hidden Markov Model (HMM) is a mathematical model that describes the sequential results of some observable events as a combination of some hidden states. HMMs enable the inference of unobservable states with respect to observed data within time series and allow defining the dependency and state changes between states. They find useful application in such activities as speech recognition tasks, gesture analysis, and anomaly detection, where they present a framework to learn complex sequential data and discover patterns within that data, leading to meaningful constructions of the data.</p><h4>Importing and Cleaning Time Series Data</h4><p>Importing:</p><p>Read CSV, Excel, databases or APIs using libraries such as Pandas.</p><p>import pandas as pd</p><p>df = pd.read_csv(&#x27;timeseries.csv&#x27;, parse_dates=[&#x27;Date&#x27;], index_col=&#x27;Date&#x27;)</p><p>Cleaning:</p><p>Treat missing items, duplications, wrong timestamps.</p><p>Make datetime an index of the DataFrame.</p><p>submit data into proper frequencies (e.g. daily, monthly) with .asfreq() or resample().</p><h4>Plotting</h4><p>The graphical representation of data that has been collected over time intervals forming a chain is the time series visualization. It includes a wide range of such methods as line plots, seasonal subseries plots, autocorrelation plots, histograms and interactive visualization. The techniques are useful in enabling the analysts to detect trends, patterns, and anomalies in time-varying data in order to understand and make better decisions.</p><h4>Various graphs of visualization of Time series</h4><p>Line Plots: The line plots are plotted based on a trend, a cycle, and changes in data patterns, which can be easily observed.</p><p>Seasonal Plots: Seasonal plots partition time series data into seasonal and non-seasonal data; this enables one to examine trends over a particular period of time.</p><p>Histograms and Density Plots: Plots the values of the data and the time of occurrence, thus giving us ideas about the nature of data such as skewness and kurtosis.</p><p>Autocorrelation and Partial Autocorrelation plots: Plots to help discover seasonality and lagged relationships as well as time series autocorrelation.</p><p>Spectral Analysis Spectral analysis tools, like periodograms and spectrograms, represent the frequency components of a time series data and can be valuable to detect periodicity and cyclical trends.</p><p>Decomposition Plots: Decomposition plots separate a time series into its trend, seasonal, and residual prices in order to determine patterns underlying a data set.</p><p>Use Matplotlib or Seaborn for line plots.</p><p>import matplotlib.pyplot as plt df[&#x27;Value&#x27;].plot(title=&#x27;Time Series Plot&#x27;) plt.show()</p><p>Moving averages Traders resort to different indicators to assist in making buy and sell decisions in technical analysis. The moving average is one of such indicators that can be utilized to smooth movements in prices on a daily basis to aid in developing a trend on the daily pricing by developing an average price that remains continuously updated.</p><p>The effects of short-term random fluctuations in the price of a stock on a given period of time can be reduced by computing the moving average. Simple moving averages (SMAs) incorporate the use of a simple arithmetic average of prices over this period of time whereas the exponential smoothing (EMAs) applies heavier weightings on more recent prices than old prices over the timespan.</p><p>Calculation of Moving averages is done to determine the direction of a trend of a stock or to prefer its support and resistance values. It is also trend or lagging indicator since it is pegged on the historical prices.</p><ul><li>Irregularities the short returns, and emphasizes the tendencies.</li><li>Types:</li></ul><p>Simple Moving Average (SMA):</p><p>A simple moving average (SMA) is determined by the arithmetic mean of a certain the set of values over a period of time. A tranche of figures or prices of stocks are added and the sum is divided by the number of prices in the set. A security has an average security value that can be calculated using the following formula:</p><p>df[&#x27;SMA_3&#x27;] = df[&#x27;Value&#x27;].rolling(window=3).mean()</p><p>Exponential Moving Average (EMA):</p><p>The exponential moving average puts larger weights on recent prices as this is supposed to make them adapt more easily to new information. In order to compute an EMA the simple moving average (SMA) over certain time period is computed.</p><p>Then take the multiplier coefficient which scales the EMA, or so-called the smoothing factor, which is usually, [2/(chosen time period + 1)].</p><p>df[&#x27;EMA_3&#x27;] = df[&#x27;Value&#x27;].ewm(span=3).mean()</p><h4>Missing values</h4><p>Missing values or the data that is not (or not being) stored (or not being present) of some variable/s in the given dataset is called missing data.</p><p>Value that is missing in a data may be recorded in many forms, depending on the origin of the data and the conventions. Some of the typical representations here are:</p><p>NaN (Not a Number): Missing data is expressed as NaN in a lot of programming languages and data analysis packages. That is the default library of libraries such as Pandas in Python.</p><p>None or NULL: Different programming languages and databases usually have missing values, which are marked as None or NULL. An example is SQL databases where a missing value is supposed to be noted using NULL.</p><p>The values or data that are not stored (or not there) to some variable/s in the given dataset are called the missing data.</p><p>In some databases missing values may be marked by a special symbol, in others a given code can be used which reflects that there is no current value. These are some typical representations:</p><p>There might be various explanations in the absence of validations of particular values in the data. The cause of data missing on the dataset influences the process of missing data processing. Therefore, there is the need to learn what might be the reason why the data might be absent.</p><p>Among some of them are the reasons below:</p><p>Information stored in the past may be affected by failure to maintain.</p><p>There are no observations done in some of the fields because of some reasons. This may lead to inaccuracy of recording of the values since it works through humans.</p><p>Intentional failure of the user in providing the values is not provided</p><p>Item nonresponse: It is an indication that the participant did not participate.</p><p>Missing Values: In some cases, the symbols used to represent a missing value include empty strings (&quot;&quot;). This usually happens in the data that is given in text format or CSV where a field may be empty.</p><p>Special Indicators: Datasets may consider these specific values to represent special indicators, such as -999, 9999, or other values that are unlikely to occur, indicating that it is a special value, i.e. that the data point is missing. Many times it can be observed with older datasets or in certain industries where such conventions have been provided.</p><p>Blanks or Spaces: Missing values could also be indicated by spaces or blank fields in some instances especially in the text files whose widths are fixed.</p><ul><li>Strategies:</li><li>Forward fill: df.fillna(method=&#x27;ffill&#x27;)</li><li>Backward fill: df.fillna(method=&#x27;bfill&#x27;)</li><li>Interpolation: df.interpolate(method=&#x27;linear&#x27;)</li><li>Dropping rows: only if missing data is minimal</li><li>Visualize missing data using missingno or seaborn.heatmap.</li></ul><h4>Serial correlation</h4><p>Serial correlation Within a time series, serial correlation is the property of a variable and a lagged version of the same variable (i.e. a variable at time T and a variable at time T-1) being found to be correlated with each other over time. Serial correlation is common in repeating patterns when the level of one variable influences future level of the variable. The technical</p><p>analysts employ this correlation in financial terms to know how effectively the values of the prices of a security in the past are able to predict the future of the price of the same security.</p><p>Serial correlation is analogous to the statistic lagged or auto correlation.</p><p>Serial correlation can be defined as a statistical term used to explain the correlation that exists amidst the observations of identical variable regarding particular periods. When the serial correlation of a variable is found at zero then there is no correlation, and all the observations are independent of the other. On the other hand, when the serial correlation of one variable is biased towards 1, then the observations are serially correlated and prior observations influence the outcome of the future observations. In essence, serial correlation variable is not random but has a pattern.</p><p>Serial correlation as applied to engineering has the purpose of measuring how a signal, (eg, a signal sent out by a computer or a wave in the radio band) varies relative to itself as a function of time. This idea increased its popularity in economic circles where economist and econometricians used the measure to compare economic data over periods of time.</p><p>Nearly every major financial organization currently employees quantitative analysts, quants, to aid in mathematical analysis of some aspect of their business. Technical analysis and other statistical inferences are what these financial trading analysts apply in analyzing and forecasting on the stock market. With the aim to make better predictions and opportunities of a strategy being successful in terms of profitability these modelers are trying to determine the form of the correlations. Also, determining correlation structure more accurately enhances the reality of any of the simulated time series to be based on the model. Precise simulations decrease the danger of the investments strategy.</p><p>The success of many of these financial institutions depends on quants because they offer the institution market models which in turn constitutes a foundation of investment affair of the institution.</p><p>Autocorrelation Autocorrelation A mathematical description of the extent to which a particular time series resembles a lagged realization of the same series with respect to successive time span. It is analogous to the correlation between two different time series but the two time series used in autocorrelation are the same but one series is lagged one or more time periods.</p><p>To give an example, assuming that it is raining today, the data will indicate that there is a higher probability that it will rain tomorrow as compared to today when it is clear. In the case of investments, equity is the stock that may exhibit powerful positive autocorrelation of returns to indicate that when the stock is up today, it is much more probable that it would be up tomorrow as well.</p><p>Of course, autocorrelation may be an effective concept that can be applied by traders; especially by technical analysts.</p><p>Autocorrelation is also called lagged correlation and serial correlation since it evaluates how a current value of a variable relates to its preceding values. Just to give a very simple illustration and look at the five values in the chart below in percentages. These we compare them with the column on the right, which has identical set of values, simply shifted up one row.</p><h4>Predictive modeling \u2013 Overview</h4><p>Predictive modeling is a mathematical process that is employed in the prediction of the future by identifying the trends in a particular and available input data. It forms part of a very important element of predictive analytics, a form of data analytics that is used to predict activity, behavior and trends by using both current and historical data.</p><p>Computing the quality of a sales lead, the probability of spam or the probability a person will click on a link or purchase a product are examples of a predictive models. The functionality is frequently embedded within various business applications thus it may be worth getting to know the mechanics of predictive modeling operations in order to do troubleshooting and optimize its functionality.</p><p>Despite the implication of the term predictive modeling (to be concerned with the prediction of the future), it can be used to make predictions (e.g., the likelihood that a transaction is fraudulent). Here the act of fraud has already taken place. The idea, here is to forecast that the transaction will be considered as fraud in the future analysis. The predictive modeling is also able to predict future requirements or what-if analysis.</p><p>Evaluating Predictive models The current data-driven solution engines are the machine learning models, and the question is how would one know whether they are performing their duties, i.e. working well? The model evaluation metrics would play this role: assisting a person in grasping the strengths and weaknesses of a model with the aim of optimization and final implementation of the matter in real life. Whether it is a model to store which emails should be classified, house price forecast, customer segment clustering, among others, learning how to assess a model based on different metrics is a valuable job.</p><p>A confusion matrix is a visualization of prediction performance by categorizing outcomes:</p><ul><li>True Positive (TP): Correctly identified as positive</li><li>True Negative (TN): Correctly identified as negative</li><li>False Positive (FP): Incorrectly identified as positive</li><li>False Negative (FN): Missed positive cases</li></ul><p>Accuracy, defined as (TP+TN)/(Total), is simple. However it can be misleading in an unbalanced dataset.</p><p>Precision: Also known as Positive Predictive Value, it is the value that shows the true positive cases calculated against a total number of predicted positive outcomes.</p><p>Recall (Sensitivity or True Positive Rate): It measures the percentage of the true positive out of all the real positives.</p><p>F1 Score: It measures a range between precision and recall, and gives an equal balance to the trade-off between precision and recall.</p><p>ROC-AUC (Receiver Operating Characteristic -Area Under Curve)</p><p>The ROC curve plots the relationship between False Positive Rate (FPR) and True Positive Rate (TPR) at each of different threshold levels of classification. The AUC (Area Under Curve) condenses the capacity of the model to differentiate between the classes:</p><h4>AUC 1.0: The ideal classifier</h4><h4>ABC</h4><h4>AUC= 0.5: Random accuracy</h4><h4>Regression Metrics: In predicting continuous values</h4><p>Root Means Error squared (RMSE): Standard deviation of residuals:</p><h4>Mean Absolute Error (MAE): Simplicity at Work</h4><p>MAE is the average of the absolute differences between the predicted and actual value has been calculated.</p><h4>Mean Squared Error (MSE)</h4><p>As RMSE without the square root:</p><p>Building Predictive Model solutions Predictive analytics has received the status of a separate area within the scope of data analysis, which employs a range of tools, including statistics, machine learning, and artificial neural networks towards a possible forecasting of the future course of events, relying solely on the past data.</p><p>The primary objective of predictive analytics is expressing what could occur in the future, such as trends, particular behavior and events, amongst others, to automatically classify data points, or anticipate possible outcomes with data. In simple terms, predictive analytics involves utilizing all the information in determining the probability of occurrence.</p><p>In addition to the above, there are other forms of analytics that you have probably heard of, i.e. descriptive analytics, diagnostic analytics, and prescriptive analytics, which are simply the levels of analytics maturity.</p><p>However, before immersing yourself into data and algorithms, it is crucial first to determine the kind of issues you wish to overcome through the predictive analytics model. This could be through a consultation with stakeholders who you are looking to hear about their frustrations, and what their expectation and success would be like.</p><h4>Data collection</h4><p>After having defined the goals, you continue to gather information to generate a model of a predictive analysis. In the case of data, most of the time it falls into 2 categories:</p><p>Scenario 1 -Your company already has sufficient internal business data that has been accumulated over the years.</p><p>Scenario 2 - There is no data at your disposal or the amount of it is not copious. In case it is so, it will be required to include data based on external sources (e.g. free public datasets; some data can be obtained on providers).</p><h4>Processing and preparation of data</h4><p>The most crucial and lengthiest stage of the AI predictive modeling segment which can be described as data preparation and processing. The stage may consume as much as 80% of the total project time since detailed work is involved.</p><h4>Data cleaning</h4><p>The step to take is to eliminate mistake and discrepancies. This is in the sense that we:</p><p>remove noise</p><p>correct inaccuracies</p><h4>Data that are blanks can be replaced by average numbers</h4><p>delete un finished or abnormal records, etc.</p><p>Clean data will help to eliminate low-quality inputs that may distort predictions of the model.</p><h4>Data transformation</h4><p>Once cleaned the data must often be converted into an appropriate model-ready format. In this step we approach things in the following way.</p><h4>Feature engineering</h4><p>It is the method of applying domain knowledge to filter, transform or construct new characteristics out of raw data so as to aid the predictive capacity of machine learning algorithms. In essence, all we evaluate is the usefulness of the current available data features and concur to determine whether new data features are required or not.</p><p>This will need that a deep analysis of the data is carried out to find the latent correlations and it will identify the importance of every feature.</p><p>To illustrate, we may not use height and weight as two different features when manipulating the data of patients, but we form a new variable, known as Body Mass Index (BMI).</p><h4>Training and test set generation</h4><p>The last procedure is to split the information into distinct groups: traditionally 80 percent will be used to train and 20 percent to test and verify. Such division is used to train the model correctly and measure its performance properly.</p><h4>Choicing of predictive modelling strategies</h4><p>When we possess some data we choose some predictive modeling method. Different predictive models can be selected, depending on a task you want to solve. And, as the example it is possible to put before us Scikit-learn library where even in the separate roadmap the idea of what model better to choose according to what and how much data is already at hand and what objective is can be grasped.</p><h4>Classification</h4><p>The classification of machine learning is merely the forecast of group or category of the data under consideration. It receives input data, and a category (class) label is applied to these data depending on the features they have.</p><p>nce we select the appropriate future model, we train it using your ready dataset. During this phase, you set a specific parameter - the configuratory elements that determine how the model behaves. For example, a healthcare model that predicts the risks of lung cancer can control the rate of learning or model to prevent overfiting.</p><p>We also need to adjust these parameters to improve the accuracy and efficiency of the model. For example, in e-commerce applications for predicting demand, these adjustments may be favorable for handling seasonal trends or changes in consumer behavior.</p><p>In addition, when we train a future stating model, we assess its performance against testing data using matrix that are suitable for its type.</p><p>For classification tasks, we use matrix such as:</p><p>The accuracy assesses the overall purity of the model.</p><p>The accurate checks how many examples of the model predict correctly.</p><p>In regression functions, normal matrix includes:</p><p>The mean paid error (MSE) calculates the average repayment difference between estimated values and real values.</p><p>R-Squar shows how well the model predicts unseen samples.</p><p>Of course, there are many other machine learning matrix to include.</p><p>Sentiment Analysis The emotion analysis, also known as opinion mining, involves subjective information such as processing text data to remove emotions, opinions or approaches. This enables machines to explain the spirit of the text material by analyzing keywords, references, tones and grammar.</p><p>For example, analyzing product reviews to determine that customers are satisfied or dissatisfied, it is a general use of emotion analysis.</p><h4>Importance</h4><p>Customer insights: Businesses help businesses understand the opinion of customers about products or services.</p><p>Brand Monitoring: Tracks public spirit about a brand on platforms such as social media.</p><p>Market Research: Analyze the trend and public opinion to inform the decision making.</p><p>Crisis Management: Recognizes negative emotions quickly, allows organizations to address issues immediately.</p><p>Individualization: Customer enables corresponding marketing campaigns depending on emotions and preferences.</p>"];
